<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeQuest - Professore Accesso</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
</head>

<body class="theme-teacher" data-role="teacher">
    <div class="login-container">
        <div class="login-header">
            <div class="login-logo">&lt;/&gt; CODEQUEST</div>
            <div class="login-subtitle">TEACHER ACCESS TERMINAL</div>
            <div class="login-role">PROFESSORE</div>
        </div>

        <div class="login-tabs">
            <div class="login-tab active" data-tab="login">LOGIN</div>
            <div class="login-tab" data-tab="register">REGISTRAZIONE</div>
        </div>

        <div class="login-body">
            <form id="form-login">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" placeholder="prof@scuola.it" required>
                </div>
                <div class="form-group">
                    <label for="login-pass">Password</label>
                    <input type="password" id="login-pass" placeholder="••••••••" required minlength="6">
                </div>
                <div class="form-error" id="login-error"></div>
                <button type="submit" class="btn-submit" id="login-btn">ACCESS PANEL</button>
            </form>

            <form id="form-register" class="hidden">
                <div class="form-group">
                    <label for="reg-name">Full Name</label>
                    <input type="text" id="reg-name" placeholder="Prof. Mario Rossi" required>
                </div>
                <div class="form-group">
                    <label for="reg-email">Email</label>
                    <input type="email" id="reg-email" placeholder="prof@scuola.it" required>
                </div>
                <div class="form-group">
                    <label for="reg-pass">Password</label>
                    <input type="password" id="reg-pass" placeholder="Min 6 caratteri" required minlength="6">
                </div>
                <div class="form-group">
                    <label for="reg-pass2">Confirm Password</label>
                    <input type="password" id="reg-pass2" placeholder="Ripeti password" required minlength="6">
                </div>
                <div class="form-error" id="reg-error"></div>
                <button type="submit" class="btn-submit" id="reg-btn">CREATE ACCOUNT</button>
            </form>
        </div>

        <div class="login-footer">
            <a href="student_login.html">← Student Access</a>
            <a href="selection.html">← Back to selection</a>
        </div>
    </div>
    <script src="js/auth/auth.js"></script>
</body>

</html>
